name: Build Static Binaries

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-linux-glibc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux glibc binaries
        uses: docker://python:3.11-slim-bullseye
        with:
          args: bash -c "apt-get update && apt-get install -y binutils && OUTPUT_DIR=/github/workspace/dist bash build_scripts/build_linux.sh"

      - name: Upload Linux glibc artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-glibc-binaries
          path: dist/*_linux_*
          if-no-files-found: error

  build-linux-musl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Linux musl binaries
        uses: docker://python:3.11-alpine
        with:
          args: sh -c "apk add --no-cache gcc musl-dev python3-dev libffi-dev openssl-dev cargo rust bash git binutils && OUTPUT_DIR=/github/workspace/dist bash build_scripts/build_musl.sh"

      - name: Upload Linux musl artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-binaries
          path: dist/*_musl_*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows binaries
        shell: bash
        run: bash build_scripts/build_windows.sh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*_windows*
          if-no-files-found: error

  release:
    needs: [build-linux-glibc, build-linux-musl, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Linux glibc artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-glibc-binaries
          path: binaries/

      - name: Download Linux musl artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-musl-binaries
          path: binaries/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: binaries/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          body: Automated build from commit ${{ github.sha }}
          files: binaries/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
